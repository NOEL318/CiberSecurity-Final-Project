plugins {
    id 'com.android.application'
}

android {
    namespace 'mx.udlap.lis4062.securesms'
    compileSdk 36

    defaultConfig {
        applicationId "mx.udlap.lis4062.securesms"
        minSdk 26          // Android 8.0+ (java.util.Base64, ECDH, AES-GCM available)
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No external libraries: only the Android framework and the platform crypto provider (Conscrypt).
dependencies {
}
